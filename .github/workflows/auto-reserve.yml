name: Auto Reserve Topic
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  reserve:
    if: contains(github.event.issue.labels.*.name, 'reservation') || startsWith(github.event.issue.title, '[Заявка]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if reservations are open
        id: check_open
        uses: actions/github-script@v7
        env:
          RESERVATIONS_OPEN: ${{ secrets.RESERVATIONS_OPEN }}
        with:
          script: |
            const isOpen = process.env.RESERVATIONS_OPEN?.trim().toLowerCase();
            
            // Если переменная не установлена, считаем что прием открыт (обратная совместимость)
            if (!isOpen || isOpen === 'true' || isOpen === '1' || isOpen === 'yes') {
              console.log('Прием заявок открыт');
              return;
            }
            
            // Прием заявок закрыт
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Прошу прощения, прием заявок на темы окончен.**\n\nВ настоящее время резервация новых тем недоступна. Следите за объявлениями о возобновлении приема заявок.\n\nЕсли у вас есть вопросы, обратитесь к куратору репозитория.'
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            core.setFailed('Прием заявок на темы закрыт.');

      - name: Extract form data
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > parse.js << 'SCRIPT'
          const body = process.env.ISSUE_BODY || '';
          
          // Отладочный вывод
          console.error('=== DEBUG: Issue Body ===');
          console.error(body);
          console.error('=========================\n');
          
          function extractField(body, label) {
            const regex = new RegExp(`### ${label}\\s*\\n\\s*(.+?)(?=\\n###|$)`, 's');
            const match = body.match(regex);
            const value = match ? match[1].trim() : '';
            console.error(`Field "${label}": "${value}"`);
            return value;
          }
          
          const level = extractField(body, 'Уровень');
          const fio = extractField(body, 'ФИО студента');
          const group = extractField(body, 'Группа');
          const slugRaw = extractField(body, 'Выберите тему');
          const slug = slugRaw.includes('|') ? slugRaw.split('|')[0].trim() : slugRaw.trim();
          const supervisor = extractField(body, 'Научный руководитель');
          const access = extractField(body, 'Код доступа');
          
          console.error(`\nExtracted slug: "${slug}"\n`);
          
          console.log(`level=${level}`);
          console.log(`fio=${fio}`);
          console.log(`group=${group}`);
          console.log(`slug=${slug}`);
          console.log(`supervisor=${supervisor}`);
          console.log(`access_code=${access}`);
          SCRIPT
          
          node parse.js >> $GITHUB_OUTPUT

      - name: Validate inputs
        id: validate
        continue-on-error: true
        # Данные из заявки передаются через env, а не подстановкой в скрипт: так их нельзя исполнить как код
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          FORM_LEVEL: ${{ steps.extract.outputs.level }}
          GROUP: ${{ steps.extract.outputs.group }}
        run: |
          if [ -z "$SLUG" ]; then
            echo "error=empty_slug" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          FILE="diploma-info/topics/${SLUG}.md"
          if [ ! -f "$FILE" ]; then
            echo "error=file_not_found" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Проверка, что тема свободна
          if grep -qiE '^\*\*Статус:\*\*\s*(Зарезервирована|в работе|завершена)' "$FILE"; then
            echo "error=topic_taken" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Уровень формы, группы и темы должны совпадать
          node .github/scripts/check-reservation-level.js "$FILE" >> $GITHUB_OUTPUT || exit 1

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Handle validation errors
        if: steps.validate.outputs.error != ''
        uses: actions/github-script@v7
        env:
          ERROR: ${{ steps.validate.outputs.error }}
          SLUG: ${{ steps.extract.outputs.slug }}
          GROUP_LEVEL: ${{ steps.validate.outputs.group_level }}
          TOPIC_LEVEL: ${{ steps.validate.outputs.topic_level }}
        with:
          script: |
            const error = process.env.ERROR;
            const forms = `[Issues → New issue](https://github.com/${{ github.repository }}/issues/new/choose)`;
            const catalog = `[каталога](https://github.com/${{ github.repository }}/tree/main/diploma-info/topics)`;
            let message = '';

            if (error === 'no_form_level') {
              message = `❌ **Заявка отклонена:** не указан уровень обучения.\n\nСоздайте заявку через форму своего уровня: ${forms} → «Резервация темы — бакалавриат» или «Резервация темы — магистратура».`;
            } else if (error === 'bad_group') {
              message = '❌ **Заявка отклонена:** группа указана не в формате МИРЭА.\n\nУкажите полный шифр группы, например `ЭФБО-01-23` или `ЭФМО-01-25`, и создайте новую заявку.';
            } else if (error === 'group_level_unknown') {
              message = '❌ **Заявка отклонена:** по шифру группы нельзя определить уровень (третья буква должна быть Б — бакалавриат или М — магистратура).\n\nЕсли группа указана верно, обратитесь к куратору.';
            } else if (error === 'group_level_mismatch') {
              message = `❌ **Заявка отклонена:** форма не соответствует вашей группе — по шифру группы ваш уровень: **${process.env.GROUP_LEVEL}**.\n\nСоздайте заявку через форму своего уровня: ${forms}.`;
            } else if (error === 'topic_no_level') {
              message = '❌ **Заявка отклонена:** у темы не указан уровень обучения.\n\nЭто ошибка в каталоге, а не в вашей заявке. Обратитесь к куратору.';
            } else if (error === 'topic_level_mismatch') {
              message = `❌ **Заявка отклонена:** эта тема предназначена для уровня **${process.env.TOPIC_LEVEL}**.\n\nВыберите тему своего уровня из ${catalog}.`;
            } else if (error === 'empty_slug') {
              message = '❌ **Заявка отклонена:** Не указан slug темы.\n\nПожалуйста, заполните форму корректно и создайте новую заявку.';
            } else if (error === 'file_not_found') {
              message = `❌ **Заявка отклонена:** Тема с slug \`${process.env.SLUG}\` не найдена.\n\nПроверьте правильность slug (имя файла без \`.md\`) в каталоге [topics](https://github.com/${{ github.repository }}/tree/main/diploma-info/topics).`;
            } else if (error === 'topic_taken') {
              message = '❌ **Заявка отклонена:** Тема **уже зарезервирована** другим студентом.\n\nПожалуйста, выберите другую тему из [каталога](https://github.com/${{ github.repository }}/tree/main/diploma-info/topics) со статусом "Свободно".';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            core.setFailed(`Validation failed: ${error}`);

      - name: Check access code
        if: steps.validate.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          ACCESS_CODE: ${{ steps.extract.outputs.access_code }}
          SECRET_CODE: ${{ secrets.RESERVE_CODE }}
        with:
          script: |
            const access = process.env.ACCESS_CODE?.trim();
            const secret = process.env.SECRET_CODE?.trim();
            
            if (!secret) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Заявка отклонена:** Секрет `RESERVE_CODE` не настроен в репозитории.\n\nОбратитесь к администратору репозитория.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              core.setFailed('Секрет RESERVE_CODE не задан в репозитории.');
              return;
            }
            
            if (access !== secret) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Заявка отклонена:** Неверный код доступа.\n\nОбратитесь к куратору за корректным кодом доступа для резервации темы.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              core.setFailed('Неверный код доступа. Заявка закрыта.');
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reserve topic in markdown
        env:
          FILE_PATH: diploma-info/topics/${{ steps.extract.outputs.slug }}.md
          FIO: ${{ steps.extract.outputs.fio }}
          GROUP: ${{ steps.validate.outputs.group }}
          SUPERVISOR: ${{ steps.extract.outputs.supervisor }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.FILE_PATH;
          let s = fs.readFileSync(path, 'utf8');

          // 1) Обновить статус на Зарезервирована
          s = s.replace(/(\*\*Статус:\*\*)\s*Свободно/i, '$1 Зарезервирована');

          // 2) Добавить раздел, если нет
          if (!/##\s*Закреплённые студенты/i.test(s)) {
            s += '\n## Закреплённые студенты\n\n';
          }

          const today = new Date().toISOString().slice(0,10);
          const fio = (process.env.FIO || 'Студент').trim();
          const group = (process.env.GROUP || '').trim();
          const sup = (process.env.SUPERVISOR || 'Зарипова В.М.').trim();

          // 3) Добавить запись: ФИО (Группа) — дата — научный руководитель
          const entry = group ? `- **${fio}** (${group}) — ${today} — ${sup}\n` : `- **${fio}** — ${today} — ${sup}\n`;
          s = s.replace(/(##\s*Закреплённые студенты[\s\S]*?)$/i, `$1${entry}\n`);

          fs.writeFileSync(path, s, 'utf8');
          NODE

      - name: Generate reserved topics page
        run: |
          chmod +x .github/scripts/generate-reserved-topics.js
          node .github/scripts/generate-reserved-topics.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-reserve: ${{ steps.extract.outputs.slug }} via issue #${{ github.event.issue.number }}" || echo "Nothing to commit"
          git push

      - name: Notify success
        if: success()
        uses: actions/github-script@v7
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          FIO: ${{ steps.extract.outputs.fio }}
          GROUP: ${{ steps.validate.outputs.group }}
          SUPERVISOR: ${{ steps.extract.outputs.supervisor }}
        with:
          script: |
            const slug = process.env.SLUG;
            const fio = process.env.FIO;
            const group = process.env.GROUP;
            const supervisor = process.env.SUPERVISOR;
            
            const studentInfo = group ? `${fio} (${group})` : fio;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Тема успешно зарезервирована!**\n\n**Студент:** ${studentInfo}\n**Научный руководитель:** ${supervisor}\n**Тема:** [\`${slug}\`](https://github.com/${{ github.repository }}/blob/main/diploma-info/topics/${slug}.md)\n\n---\n\n### Следующие шаги:\n\n1. Изучите [гайды по подготовке диплома](https://github.com/${{ github.repository }}/tree/main/diploma-info/guides)\n2. Ознакомьтесь с [рекомендуемым порядком работы](https://github.com/${{ github.repository }}/blob/main/diploma-info/guides/README.md#рекомендуемый-порядок-изучения)\n3. Настройте локальную среду разработки\n4. Свяжитесь с научным руководителем для уточнения деталей\n\nУдачи в работе над дипломом! 🎓`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
