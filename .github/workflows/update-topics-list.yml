name: Update Topics Dropdown

on:
  push:
    paths:
      - 'diploma-info/topics/*.md'
      - '.github/scripts/levels.js'
      - '.github/scripts/update-topics-dropdown.js'
    branches:
      - main
  workflow_dispatch:

jobs:
  update-dropdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate topics lists
        id: gen
        continue-on-error: true
        run: node .github/scripts/update-topics-dropdown.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet .github/ISSUE_TEMPLATE/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/reserve-bachelor.yml .github/ISSUE_TEMPLATE/reserve-master.yml
          git commit -m "chore: обновлены списки доступных тем в формах резервации"
          # Generate Reserved Topics Page запускается на тот же push и может успеть запушить раньше
          git pull --rebase origin main
          git push

      - name: Summary
        if: steps.check.outputs.changed == 'true'
        run: echo "✅ Списки тем в формах обновлены автоматически"

      # Формы обновлены и закоммичены, но про темы без уровня куратор должен узнать
      - name: Fail on topics without level
        if: steps.gen.outcome == 'failure'
        run: |
          echo "❌ Генератор форм завершился с ошибкой: см. шаг Generate topics lists"
          exit 1
