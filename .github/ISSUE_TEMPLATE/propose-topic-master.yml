name: Предложение темы — магистратура
description: Магистрант предлагает свою тему ВКР на рассмотрение
labels: [topic-proposal, proposal-master]
title: "[Предложение] <краткое название темы>"
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 Предложение темы магистерской ВКР

        Магистерская ВКР — научная или научно-практическая работа: **научная новизна, гипотеза и эксперимент обязательны**, по материалам работы нужна статья. Требования: [master.md](https://github.com/VikZarip/mirea-iptip-diploma-topics/blob/main/diploma-info/requirements/master.md).

        Если вы учитесь в бакалавриате, закройте форму и выберите «Предложение темы — бакалавриат».

  - type: dropdown
    id: level
    attributes:
      label: Уровень
      description: Подтвердите уровень обучения. Он должен совпадать с вашей группой.
      options:
        - Магистратура
    validations:
      required: true

  - type: input
    id: fio
    attributes:
      label: ФИО студента
      placeholder: Иванов Иван Иванович
    validations:
      required: true

  - type: input
    id: group
    attributes:
      label: Группа
      description: Полный шифр группы, например ЭФМО-01-25
      placeholder: ЭФМО-01-25
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Название темы
      description: Полное название дипломной работы
      placeholder: Система прогнозирования нагрузки на серверы с использованием машинного обучения
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Предлагаемый slug
      description: Короткое имя для файла темы (латиница, через дефис)
      placeholder: server-load-forecasting
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Краткое описание
      description: Опишите суть темы и ключевую проблему (2-4 предложения)
      placeholder: |
        Создание системы для прогнозирования нагрузки на серверы компании...
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Ожидаемый результат
      description: Что именно будет на выходе? Какие отчётные материалы?
      placeholder: |
        - Модель прогнозирования нагрузки
        - Веб-панель мониторинга
        - Научная статья
    validations:
      required: true

  - type: textarea
    id: functions
    attributes:
      label: Возможные функции/компоненты
      description: Перечислите основные функции и компоненты системы
      placeholder: |
        - Сбор метрик с серверов
        - ETL-пайплайн
        - ML-модели для прогнозирования
    validations:
      required: true

  - type: textarea
    id: tech_stack
    attributes:
      label: Технологический стек
      description: Предполагаемые технологии, библиотеки, платформы
      placeholder: |
        - Python (Pandas, scikit-learn, XGBoost)
        - PostgreSQL
        - Docker
    validations:
      required: false

  - type: textarea
    id: use_cases
    attributes:
      label: Основные сценарии использования
      description: Опишите ключевые use cases (роли, шаги, результаты)
      placeholder: |
        - Администратор просматривает прогноз нагрузки на 24 часа
        - Система автоматически масштабирует ресурсы при превышении порога
    validations:
      required: true

  - type: textarea
    id: novelty
    attributes:
      label: Научная новизна и актуальность
      description: Обоснуйте новизну и актуальность темы
      placeholder: |
        Существующие решения не учитывают специфику...
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Гипотеза исследования
      description: Проверяемое утверждение, которое подтвердит или опровергнет эксперимент
      placeholder: |
        Пошаговая актуализация модели точнее определяет статус задач, чем обработка всей истории целиком.
    validations:
      required: true

  - type: textarea
    id: methods
    attributes:
      label: Методы, модели и данные
      description: Какие методы/модели планируете использовать? Откуда данные?
      placeholder: |
        - Методы: LSTM, Prophet, XGBoost
        - Данные: метрики Prometheus, логи nginx
    validations:
      required: true

  - type: textarea
    id: experiment
    attributes:
      label: План эксперимента
      description: С какими базовыми подходами (baseline) сравниваете, на каких данных, по каким метрикам
      placeholder: |
        - Baseline: обработка каждой встречи отдельно; полный пересчёт истории
        - Данные: AMI Meeting Corpus + свой размеченный набор
        - Метрики: F1 извлечения, доля верных статусов
    validations:
      required: true

  - type: textarea
    id: literature
    attributes:
      label: Ключевые публикации
      description: 3–5 научных работ, на которые опирается тема (включая иностранные)
    validations:
      required: true

  - type: textarea
    id: practical_value
    attributes:
      label: Практическая польза
      description: Какой эффект и для кого?
      placeholder: |
        - Снижение затрат на инфраструктуру на 20%
        - Предотвращение простоев сервисов
        - Улучшение качества обслуживания клиентов
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: Метрики успеха
      description: Конкретные измеримые показатели эффективности решения
      placeholder: |
        - Точность прогноза > 90%
        - Время отклика системы < 100 мс
        - Снижение ошибок на 30%
    validations:
      required: true

  - type: textarea
    id: project_plan
    attributes:
      label: Этапы проекта (план студента)
      description: Предварительный план выполнения работы с указанием сроков
      placeholder: |
        1. Анализ предметной области и сбор требований (сентябрь-октябрь)
        2. Проектирование архитектуры системы (ноябрь)
        3. Разработка прототипа (декабрь-январь)
        4. Тестирование и оптимизация (февраль-март)
        5. Статья по материалам работы (к марту)
        6. Подготовка текста ВКР и защита (апрель-май)
    validations:
      required: true

  - type: textarea
    id: data_sources
    attributes:
      label: Источники данных
      description: Укажите открытые или внутренние источники данных (если применимо)
      placeholder: |
        - Kaggle Dataset: Server Metrics
        - Внутренние метрики компании
    validations:
      required: false

  - type: input
    id: supervisor
    attributes:
      label: Научный руководитель (если согласован)
      value: Зарипова В.М.
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Дополнительная информация
      description: Любая другая важная информация о теме
    validations:
      required: false
