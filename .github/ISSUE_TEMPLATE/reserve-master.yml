name: Резервация темы — магистратура
description: Заявка студента магистратуры на резервацию темы
labels: [reservation, reservation-master]
title: "[Заявка] ФИО — <slug>"
body:
  - type: markdown
    attributes:
      value: |
        Это форма для студентов уровня **магистратура**. Если вы учитесь в бакалавриате, закройте форму и выберите другую.

        После создания заявки тема будет автоматически переведена в статус «Зарезервирована», если она свободна и подходит вашему уровню.
  - type: dropdown
    id: level
    attributes:
      label: Уровень
      description: Подтвердите уровень обучения. Он должен совпадать с вашей группой и с уровнем темы.
      options:
        - Магистратура
    validations:
      required: true
  - type: input
    id: fio
    attributes:
      label: ФИО студента
      placeholder: Иванов Иван Иванович
    validations:
      required: true
  - type: input
    id: group
    attributes:
      label: Группа
      description: Полный шифр группы, например ЭФМО-01-25
      placeholder: ЭФМО-01-25
    validations:
      required: true
  - type: dropdown
    id: slug
    attributes:
      label: Выберите тему
      description: Список обновляется автоматически и содержит только свободные темы для уровня «магистратура». Каталог — diploma-info/topics/
      options:
        - conflict-of-interest-detection | Алгоритмы выявления конфликта интересов в управленческих решениях
        - environmental-disaster-warning | Система раннего предупреждения экологических катастроф на основе IoT-датчиков
        - medical-staff-allocation | Разработка алгоритмов оптимального распределения медицинского персонала многопрофильной клиники с учётом прогноза потока пациентов
        - multi-apartment-energy-management | Интеллектуальная система управления энергопотреблением многоквартирных домов
        - pandemic-early-warning | Система раннего предупреждения эпидемий на основе анализа больших данных
        - platform-family-support | Платформа поддержки семей с детьми через персонализированные рекомендации
        - social-benefits-fraud-detection | Интеллектуальная система выявления мошенничества при получении социальных выплат
        - social-workers-routing | Метод оптимального планирования маршрутов социальных работников с учётом приоритетов визитов, временных окон и динамического перепланирования
        - urban-air-quality-monitoring | Интеллектуальная система мониторинга качества воздуха в городах
        - utility-consumption-forecast | Система умного учёта и прогнозирования потребления коммунальных ресурсов
    validations:
      required: true
  - type: input
    id: supervisor
    attributes:
      label: Научный руководитель
      value: Зарипова В.М.
    validations:
      required: true
  - type: input
    id: access_code
    attributes:
      label: Код доступа
      description: Получите код у куратора. Заявки без корректного кода автоматически отклоняются.
      placeholder: XXXXX
    validations:
      required: true
